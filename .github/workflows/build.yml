name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Get time-stretch libraries
        run: |
          mkdir -p app/src/main/cpp/deps && cd app/src/main/cpp/deps
          git clone --depth 1 https://github.com/Signalsmith-Audio/signalsmith-stretch.git signalsmith-stretch
          git clone --depth 1 https://github.com/Signalsmith-Audio/linear.git signalsmith-linear
          git clone --depth 1 --branch v4.0.0 https://github.com/breakfastquay/rubberband.git rubberband \
            || git clone --depth 1 https://github.com/breakfastquay/rubberband.git rubberband
          git clone --depth 1 https://github.com/marton78/pffft.git pffft
          echo "--- how signalsmith-linear uses PFFFT ---"
          grep -rn -i "pffft" signalsmith-linear --include=*.h | head -40 || true
          ls pffft

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MusicPractice.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Music Practice build ${{ github.run_number }}
          body: "Download MusicPractice.apk below on your phone and open it to install."
          files: MusicPractice.apk
          make_latest: true
